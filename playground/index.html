<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cordlang Playground</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --text: #e8eefc;
      --muted: #9aa8c7;
      --accent: #5b8def;
      --ok: #3ecf8e;
      --err: #f07178;
      --warn: #e0b25c;
      --border: #243049;
      --code: #070b14;
      --tree: #0e1626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: radial-gradient(1000px 500px at 0% -20%, #1a2744, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
      padding: 0.85rem 1.1rem;
      border-bottom: 1px solid var(--border);
      background: rgba(12, 18, 34, 0.85);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    h1 { font-size: 1.05rem; margin: 0; letter-spacing: -0.02em; }
    .tag {
      font-size: 0.72rem;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.12rem 0.45rem;
    }
    .tag.ready { color: var(--ok); border-color: #2a5a44; }
    .tag.err { color: var(--err); border-color: #5a2a30; }
    select, button {
      font: inherit;
      font-size: 0.85rem;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.35rem 0.65rem;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: transparent;
      color: #061018;
      font-weight: 600;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.ghost {
      padding: 0.2rem 0.45rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    main {
      display: grid;
      grid-template-columns: 220px 1fr 1fr;
      min-height: calc(100vh - 52px);
    }
    @media (max-width: 1100px) {
      main { grid-template-columns: 200px 1fr; }
      .pane.out { grid-column: 1 / -1; min-height: 36vh; }
    }
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; }
      .tree { max-height: 28vh; border-right: 0; border-bottom: 1px solid var(--border); }
    }
    .tree {
      display: flex;
      flex-direction: column;
      background: var(--tree);
      border-right: 1px solid var(--border);
      min-height: 0;
    }
    .tree-head, .pane-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 0.45rem 0.7rem;
      border-bottom: 1px solid var(--border);
    }
    .tree-actions { display: flex; gap: 0.25rem; }
    #files {
      flex: 1;
      overflow: auto;
      padding: 0.35rem 0;
    }
    .file {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.78rem;
      font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      padding: 0.28rem 0.7rem;
      cursor: pointer;
    }
    .file:hover { background: #182338; }
    .file.active { background: #1d2d4c; color: #fff; }
    .file.has-error { color: var(--err); }
    .file .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file .del {
      opacity: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 0 0.15rem;
      font-size: 0.85rem;
    }
    .file:hover .del { opacity: 1; }
    .file .del:hover { color: var(--err); }
    .pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      min-height: 50vh;
      min-width: 0;
    }
    .pane.out { border-right: none; }
    .tabs {
      display: flex;
      gap: 0;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: #0f1728;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex: 0 0 auto;
      border: 0;
      border-right: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.78rem;
      font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      padding: 0.42rem 0.55rem 0.42rem 0.75rem;
      cursor: pointer;
    }
    .tab.active { background: var(--code); color: var(--text); }
    .tab .x {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 0 0.1rem;
      font-size: 0.85rem;
    }
    .tab .x:hover { color: var(--text); }
    textarea, pre {
      flex: 1;
      margin: 0;
      padding: 0.85rem 1rem;
      border: 0;
      background: var(--code);
      color: var(--text);
      font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.45;
      resize: none;
      outline: none;
      white-space: pre;
      overflow: auto;
    }
    #status {
      font-size: 0.8rem;
      color: var(--muted);
      margin-left: auto;
    }
    #status.error { color: var(--err); }
    #diags {
      max-height: 8rem;
      overflow: auto;
      background: #140e12;
      border-top: 1px solid var(--border);
      padding: 0.35rem 0.55rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      color: var(--err);
      display: none;
    }
    #diags.show { display: block; }
    .diag {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 0.2rem 0.3rem;
      cursor: pointer;
    }
    .diag:hover { background: #24151a; }
    .diag.warn { color: var(--warn); }
    .diag .hint { color: var(--muted); display: block; padding-left: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>Cordlang Playground</h1>
    <span id="badge" class="tag">loading…</span>
    <label>
      <select id="backend" title="Backend">
        <option value="react">react</option>
        <option value="svelte">svelte</option>
        <option value="vue">vue</option>
        <option value="html">html</option>
        <option value="esm">esm</option>
        <option value="email">email</option>
        <option value="ir">ir</option>
      </select>
    </label>
    <button id="run" class="primary" disabled>Compile</button>
    <span id="status">Booting WASM…</span>
  </header>
  <main>
    <aside class="tree">
      <div class="tree-head">
        <span>project</span>
        <span class="tree-actions">
          <button id="add-file" class="ghost" type="button" title="Add file">+</button>
          <button id="reset" class="ghost" type="button" title="Reset sample">reset</button>
        </span>
      </div>
      <div id="files" role="tree" aria-label="Project files"></div>
    </aside>
    <section class="pane">
      <div id="tabs" class="tabs" aria-label="Open files"></div>
      <textarea id="src" spellcheck="false" aria-label="Cord source"></textarea>
      <div id="diags"></div>
    </section>
    <section class="pane out">
      <div class="pane-label">output</div>
      <pre id="out">// codegen appears here</pre>
    </section>
  </main>

  <script type="module">
    const ROOT = "/playground";
    const ENTRY = "/playground/src/app.cord";
    const MAX_FILES = 128;

    const SAMPLE = {
      "/playground/cordlang.json":
        '{\n  "name": "wasm-project",\n  "entry": "src/app.cord"\n}\n',
      "/playground/src/app.cord":
        "use ./layouts/default\n" +
        "use ./components/Counter\n" +
        "route / => pages/HomePage\n" +
        "def App\n" +
        "  HomePage\n",
      "/playground/src/layouts/default.cord":
        "layout default\n" +
        "  col\n" +
        "    slot\n",
      "/playground/src/pages/HomePage.cord":
        "use ../components/Counter\n" +
        "def HomePage\n" +
        "  col gap=16 p=24 center\n" +
        "    h1 \"Home\" size=2xl bold\n" +
        "    Counter\n",
      "/playground/src/components/Counter.cord":
        "def Counter\n" +
        "  state count=0\n" +
        "  props label: string = \"Counter\"\n" +
        "  col gap=16\n" +
        "    h1 \"#{label}\" size=xl bold\n" +
        "    span \"#{count}\" size=4xl bold\n" +
        "    row gap=8\n" +
        "      btn \"-\" @click=setCount(count - 1)\n" +
        "      btn \"+\" @click=setCount(count + 1)\n"
    };

    const badge = document.getElementById("badge");
    const status = document.getElementById("status");
    const out = document.getElementById("out");
    const diagsEl = document.getElementById("diags");
    const runBtn = document.getElementById("run");
    const backendSel = document.getElementById("backend");
    const srcEl = document.getElementById("src");
    const filesEl = document.getElementById("files");
    const tabsEl = document.getElementById("tabs");

    let files = { ...SAMPLE };
    let openTabs = [ENTRY];
    let active = ENTRY;
    let errorFiles = new Set();
    let compileProjectFn = null;
    let freeFn = null;
    let versionFn = null;
    let Module = null;

    function setBadge(text, cls) {
      badge.textContent = text;
      badge.className = "tag" + (cls ? " " + cls : "");
    }

    function rel(path) {
      return path.startsWith(ROOT + "/") ? path.slice(ROOT.length + 1) : path;
    }

    function flushEditor() {
      if (active && Object.prototype.hasOwnProperty.call(files, active)) {
        files[active] = srcEl.value;
      }
    }

    function sortedPaths() {
      return Object.keys(files).sort();
    }

    function renderTree() {
      filesEl.replaceChildren();
      for (const path of sortedPaths()) {
        const row = document.createElement("div");
        row.className =
          "file" +
          (path === active ? " active" : "") +
          (errorFiles.has(path) ? " has-error" : "");
        row.setAttribute("role", "treeitem");
        row.setAttribute("aria-selected", path === active ? "true" : "false");

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = rel(path);
        name.title = path;
        row.appendChild(name);
        row.addEventListener("click", (e) => {
          if (e.target.closest(".del")) return;
          openFile(path);
        });

        if (path !== ENTRY) {
          const del = document.createElement("button");
          del.className = "del";
          del.type = "button";
          del.title = "Remove file";
          del.setAttribute("aria-label", "Remove " + rel(path));
          del.textContent = "×";
          del.addEventListener("click", (e) => {
            e.stopPropagation();
            removeFile(path);
          });
          row.appendChild(del);
        }
        filesEl.appendChild(row);
      }
    }

    function renderTabs() {
      tabsEl.replaceChildren();
      for (const path of openTabs) {
        if (!Object.prototype.hasOwnProperty.call(files, path)) continue;
        const tab = document.createElement("div");
        tab.className = "tab" + (path === active ? " active" : "");
        const label = document.createElement("span");
        label.textContent = rel(path).split("/").pop();
        label.title = path;
        tab.appendChild(label);
        tab.addEventListener("click", (e) => {
          if (e.target.closest(".x")) return;
          openFile(path);
        });
        const close = document.createElement("button");
        close.className = "x";
        close.type = "button";
        close.title = "Close tab";
        close.setAttribute("aria-label", "Close " + rel(path));
        close.textContent = "×";
        close.addEventListener("click", (e) => {
          e.stopPropagation();
          closeTab(path);
        });
        tab.appendChild(close);
        tabsEl.appendChild(tab);
      }
    }

    function renderEditor() {
      srcEl.value = files[active] ?? "";
      srcEl.setAttribute("aria-label", rel(active));
    }

    function renderAll() {
      renderTree();
      renderTabs();
      renderEditor();
    }

    function openFile(path) {
      if (!Object.prototype.hasOwnProperty.call(files, path)) return;
      flushEditor();
      active = path;
      if (!openTabs.includes(path)) openTabs.push(path);
      renderAll();
    }

    function closeTab(path) {
      flushEditor();
      openTabs = openTabs.filter((p) => p !== path);
      if (active === path) {
        active = openTabs[openTabs.length - 1] || sortedPaths()[0] || ENTRY;
        if (active && !openTabs.includes(active)) openTabs.push(active);
      }
      renderAll();
    }

    function normalizePath(raw) {
      let path = (raw || "").trim().replace(/\\/g, "/");
      if (!path) return "";
      if (!path.startsWith("/")) path = ROOT + "/" + path.replace(/^\.\//, "");
      return path.replace(/\/{2,}/g, "/");
    }

    function addFile() {
      const raw = window.prompt(
        "New file path (virtual, under /playground)",
        "src/components/Hello.cord"
      );
      if (raw == null) return;
      const path = normalizePath(raw);
      if (!path.startsWith(ROOT + "/")) {
        status.textContent = "path must stay under /playground";
        status.className = "error";
        return;
      }
      if (Object.prototype.hasOwnProperty.call(files, path)) {
        openFile(path);
        return;
      }
      if (Object.keys(files).length >= MAX_FILES) {
        status.textContent = "project already has 128 files";
        status.className = "error";
        return;
      }
      const base = path.split("/").pop().replace(/\.cord$/, "") || "File";
      files[path] = path.endsWith(".cord")
        ? "def " + base + "\n  span \"" + base + "\"\n"
        : "";
      openFile(path);
      scheduleCompile();
    }

    function removeFile(path) {
      if (path === ENTRY || !Object.prototype.hasOwnProperty.call(files, path)) return;
      flushEditor();
      delete files[path];
      closeTab(path);
      scheduleCompile();
    }

    function resetSample() {
      files = { ...SAMPLE };
      openTabs = [ENTRY];
      active = ENTRY;
      errorFiles = new Set();
      renderAll();
      compile();
    }

    function showDiags(list) {
      errorFiles = new Set();
      if (!list || !list.length) {
        diagsEl.classList.remove("show");
        diagsEl.replaceChildren();
        renderTree();
        return;
      }
      diagsEl.classList.add("show");
      diagsEl.replaceChildren();
      for (const d of list) {
        if (d.file) errorFiles.add(d.file);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "diag" + (d.level === "warning" ? " warn" : "");
        const loc = d.file ? rel(d.file) + ":" : "";
        btn.append(
          loc +
            (d.line || 1) +
            ":" +
            (d.col || 1) +
            ": " +
            (d.level || "error") +
            ": " +
            (d.message || "") +
            (d.code ? " [" + d.code + "]" : "")
        );
        if (d.hint) {
          const hint = document.createElement("span");
          hint.className = "hint";
          hint.textContent = d.hint;
          btn.appendChild(hint);
        }
        btn.addEventListener("click", () => {
          if (d.file && Object.prototype.hasOwnProperty.call(files, d.file)) {
            openFile(d.file);
          }
        });
        diagsEl.appendChild(btn);
      }
      renderTree();
    }

    function compile() {
      if (!compileProjectFn || !Module) return;
      flushEditor();
      const backend = backendSel.value;
      status.textContent = "Compiling…";
      status.className = "";
      try {
        const ptr = compileProjectFn(ENTRY, JSON.stringify(files), backend);
        const json = Module.UTF8ToString(ptr);
        freeFn(ptr);
        const result = JSON.parse(json);
        showDiags(result.diagnostics || []);
        if (result.ok) {
          out.textContent = result.code || "";
          status.textContent =
            "ok · " + result.backend + " · " + Object.keys(files).length + " files";
        } else {
          out.textContent = result.code || "// compile failed — see diagnostics";
          status.textContent = "error";
          status.className = "error";
        }
      } catch (e) {
        status.textContent = String(e);
        status.className = "error";
      }
    }

    let debounce = null;
    function scheduleCompile() {
      clearTimeout(debounce);
      debounce = setTimeout(compile, 350);
    }

    async function boot() {
      try {
        const { default: createCordlang } = await import("./cordlang.js");
        Module = await createCordlang();
        compileProjectFn = Module.cwrap("cordlang_compile_project", "number", [
          "string",
          "string",
          "string"
        ]);
        freeFn = Module.cwrap("cordlang_free", null, ["number"]);
        versionFn = Module.cwrap("cordlang_version", "string", []);
        const ver = versionFn();
        setBadge("WASM · v" + ver, "ready");
        status.textContent = "Ready — compile a multi-file project";
        runBtn.disabled = false;
        renderAll();
        compile();
      } catch (e) {
        setBadge("WASM missing", "err");
        status.textContent = "Build WASM first (see docs/PLAYGROUND.md)";
        status.className = "error";
        renderAll();
        out.textContent =
          "// WASM not loaded.\n" +
          "// From repo root:\n" +
          "//   powershell -File playground\\build_wasm.ps1\n" +
          "//   # or: bash playground/build_wasm.sh\n" +
          "// Then serve this folder over HTTP (file:// cannot load ES modules):\n" +
          "//   npx --yes serve playground\n\n" +
          String(e);
      }
    }

    runBtn.addEventListener("click", compile);
    backendSel.addEventListener("change", compile);
    document.getElementById("add-file").addEventListener("click", addFile);
    document.getElementById("reset").addEventListener("click", resetSample);
    srcEl.addEventListener("input", () => {
      flushEditor();
      scheduleCompile();
    });

    renderAll();
    boot();
  </script>
</body>
</html>
