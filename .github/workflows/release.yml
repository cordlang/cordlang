# Build installable Cordlang CLI packages for desktop targets
# and publish them as a GitHub Release.
#
# Matrix (OS × CPU):
#   windows-x64, windows-arm64  → .exe + .zip
#   linux-x64,   linux-arm64    → .deb + .rpm + .tar.gz + .zip
#   macos-x64,   macos-arm64    → .dmg + .tar.gz + .zip
#
# Triggers:
#   - Push tag v*   (e.g. v0.0.013-alpha.1)
#   - Actions → Release → Run workflow
#   - pull_request touching release packaging (build only, no publish)
#
# Tags with alpha/beta/rc → GitHub prerelease.

name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/package_native.sh"
      - "scripts/package_windows.ps1"
      - "scripts/build_release_win.ps1"
      - "Makefile"
      - "src/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 0.0.013-alpha.1)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as prerelease (alpha/beta)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event_name == 'pull_request' && format('0.0.0-pr.{0}', github.event.number) || github.ref_name }}

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - id: ver
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ env.RAW_VERSION }}"
          RAW="${RAW#v}"
          TAG="v${RAW}"
          PRE=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.prerelease }}" == "true" ]]; then
            PRE=true
          fi
          if echo "$RAW" | grep -Eiq '(alpha|beta|rc|pre|dev)'; then
            PRE=true
          fi
          {
            echo "version=$RAW"
            echo "tag=$TAG"
            echo "prerelease=$PRE"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$RAW prerelease=$PRE"

  build:
    name: ${{ matrix.artifact }}
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows x64 (ARM64 is a separate job — isolates msys2/setup-msys2) ──
          - os: windows-latest
            artifact: cordlang-windows-x64
            binary: cordlang.exe
            kind: windows-mingw
            arch: x64
            family: windows
          # ── Linux ────────────────────────────────────────
          - os: ubuntu-latest
            artifact: cordlang-linux-x64
            binary: cordlang
            kind: unix
            arch: x64
            family: linux
          - os: ubuntu-24.04-arm
            artifact: cordlang-linux-arm64
            binary: cordlang
            kind: unix
            arch: arm64
            family: linux
          # ── macOS (macos-13 retired; Intel = macos-15-intel) ──
          - os: macos-15-intel
            artifact: cordlang-macos-x64
            binary: cordlang
            kind: unix
            arch: x64
            family: macos
          - os: macos-latest
            artifact: cordlang-macos-arm64
            binary: cordlang
            kind: unix
            arch: arm64
            family: macos

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # ── Toolchains ───────────────────────────────────────
      - name: Install MinGW (Windows x64)
        if: matrix.kind == 'windows-mingw'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          gcc --version

      - name: Install Linux packaging tools
        if: matrix.family == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential zip dpkg-dev fakeroot ruby ruby-dev rpm
          sudo gem install --no-document fpm

      - name: Prepare macOS compiler
        if: matrix.family == 'macos'
        run: |
          clang --version
          if ! command -v gcc >/dev/null 2>&1; then
            echo "CC=clang" >> "$GITHUB_ENV"
          fi

      # ── Build ────────────────────────────────────────────
      - name: Build Windows x64
        if: matrix.kind == 'windows-mingw'
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_release_win.ps1 -Version $env:VERSION

      - name: Build Unix (Linux / macOS)
        if: matrix.kind == 'unix'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          make clean || true
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu || echo 2)" RELEASE=1 VERSION="$VERSION"
          ./cordlang --version
          file ./cordlang || true
          uname -m

      # ── Package ──────────────────────────────────────────
      - name: Package Windows (.exe + .zip)
        if: matrix.family == 'windows'
        shell: pwsh
        env:
          VER: ${{ needs.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
          BIN: ${{ matrix.binary }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\package_windows.ps1 `
            -Binary $env:BIN -Version $env:VER -Arch $env:ARCH -OutDir dist

      - name: Package Unix (.deb / .rpm / .dmg / .tar.gz / .zip)
        if: matrix.kind == 'unix'
        shell: bash
        env:
          VER: ${{ needs.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
          FAMILY: ${{ matrix.family }}
          BIN: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          chmod +x scripts/package_native.sh
          scripts/package_native.sh \
            --binary "./$BIN" \
            --version "$VER" \
            --os "$FAMILY" \
            --arch "$ARCH" \
            --out dist
          ls -la dist/

      - name: Collect package files (Windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/upload | Out-Null
          Get-ChildItem -Path dist -File -Filter "$env:ART.*" | ForEach-Object {
            Copy-Item $_.FullName dist/upload/ -Force
          }
          Get-ChildItem dist/upload | Format-Table Name, Length
          if (-not (Get-ChildItem dist/upload -File)) { throw "no packages to upload" }
        env:
          ART: ${{ matrix.artifact }}

      - name: Collect package files (Unix)
        if: matrix.kind == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/upload
          shopt -s nullglob
          for f in dist/${{ matrix.artifact }}.* dist/cordlang_*.deb dist/cordlang-*.rpm; do
            [[ -f "$f" ]] || continue
            cp -f "$f" dist/upload/
          done
          ls -la dist/upload/
          test "$(find dist/upload -type f | wc -l)" -ge 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/upload/
          if-no-files-found: error
          retention-days: 14

  # Isolated so a bad msys2/setup-msys2 pin cannot poison linux/macos/windows-x64
  # action resolution (GHA resolves every uses: in a job at setup time).
  build-windows-arm:
    name: cordlang-windows-arm64
    needs: meta
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup MSYS2 Clang (Windows ARM64)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2.32.0
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-headers-git
            mingw-w64-clang-aarch64-crt-git
            make
          path-type: minimal

      - name: Build Windows ARM64
        shell: msys2 {0}
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Makefile uses CC ?= gcc; CLANGARM64 only ships clang — pass on cmdline.
          make clean || true
          make -j"$(nproc)" CC=clang CXX=clang++ RELEASE=1 VERSION="$VERSION"
          # MinGW/Clang writes cordlang.exe when targeting Windows
          if [[ -f cordlang && ! -f cordlang.exe ]]; then
            mv cordlang cordlang.exe
          fi
          ./cordlang.exe --version
          file ./cordlang.exe || true

      - name: Package Windows (.exe + .zip)
        shell: pwsh
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\package_windows.ps1 `
            -Binary cordlang.exe -Version $env:VER -Arch arm64 -OutDir dist

      - name: Collect package files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/upload | Out-Null
          Get-ChildItem -Path dist -File -Filter "cordlang-windows-arm64.*" | ForEach-Object {
            Copy-Item $_.FullName dist/upload/ -Force
          }
          Get-ChildItem dist/upload | Format-Table Name, Length
          if (-not (Get-ChildItem dist/upload -File)) { throw "no packages to upload" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cordlang-windows-arm64
          path: dist/upload/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    # PRs validate packaging only — never publish from a pull_request.
    if: github.event_name != 'pull_request'
    needs: [meta, build, build-windows-arm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten + checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          find release-assets -type f \( \
              -name '*.zip' -o -name '*.tar.gz' -o \
              -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \
            \) -exec cp -f {} assets/ \;
          # Drop accidental stage leftovers if any
          rm -f assets/_stage_* 2>/dev/null || true
          cd assets
          ls -la
          count="$(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt | wc -l)"
          test "$count" -ge 6
          sha256sum * | grep -v SHA256SUMS.txt | tee SHA256SUMS.txt
          ls -la

      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          VER="${{ needs.meta.outputs.version }}"
          PRE="${{ needs.meta.outputs.prerelease }}"
          TITLE="Cordlang ${VER}"
          CHANNEL="stable"
          if [[ "$PRE" == "true" ]]; then
            CHANNEL="prerelease (alpha/beta)"
          fi
          NOTES=$(cat <<EOF
          ## Cordlang ${VER}

          CLI instalable — **${CHANNEL}**.

          Elige el paquete de **tu** OS + CPU. El binario responde \`cordlang --version\` → \`${VER}\`.

          ### Windows
          | Archivo | Arch | Notas |
          |---------|------|-------|
          | \`cordlang-windows-x64.exe\` | x64 | portable (recomendado) |
          | \`cordlang-windows-arm64.exe\` | ARM64 | portable |
          | \`cordlang-windows-*.zip\` | — | exe + LICENSE + INSTALL.txt |

          ### Linux
          | Archivo | Distro | Arch |
          |---------|--------|------|
          | \`cordlang_*_amd64.deb\` | Debian / Ubuntu | x64 |
          | \`cordlang_*_arm64.deb\` | Debian / Ubuntu | ARM64 |
          | \`cordlang-*.x86_64.rpm\` | Fedora / RHEL / openSUSE | x64 |
          | \`cordlang-*.aarch64.rpm\` | Fedora / RHEL / openSUSE | ARM64 |
          | \`cordlang-linux-*.tar.gz\` / \`.zip\` | cualquier glibc | portable |

          \`\`\`bash
          # Debian / Ubuntu
          sudo apt install ./cordlang_*.deb
          # Fedora / RHEL
          sudo dnf install ./cordlang-*.rpm
          \`\`\`

          ### macOS
          | Archivo | CPU |
          |---------|-----|
          | \`cordlang-macos-arm64.dmg\` | Apple Silicon |
          | \`cordlang-macos-x64.dmg\` | Intel |
          | \`cordlang-macos-*.tar.gz\` / \`.zip\` | portable |

          Abre el \`.dmg\`, copia \`cordlang\` a un directorio en tu PATH (p. ej. \`/usr/local/bin\`).

          | \`SHA256SUMS.txt\` | checksums de todos los assets |

          Docs: \`docs/VERSIONING.md\` · \`docs/PREVIEW.md\`
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets"
            gh release upload "$TAG" assets/* --clobber
            if [[ "$PRE" == "true" ]]; then
              gh release edit "$TAG" --prerelease --title "$TITLE" --notes "$NOTES"
            else
              gh release edit "$TAG" --prerelease=false --title "$TITLE" --notes "$NOTES"
            fi
          else
            CREATE=(release create "$TAG" --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}")
            if [[ "$PRE" == "true" ]]; then
              CREATE+=(--prerelease)
            fi
            gh "${CREATE[@]}" assets/*
          fi
