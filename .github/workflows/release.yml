# Build installable Cordlang CLI binaries for every common desktop target
# and publish them as a GitHub Release.
#
# Matrix (OS × CPU):
#   windows-x64, windows-arm64
#   linux-x64,   linux-arm64
#   macos-x64,   macos-arm64
#
# Triggers:
#   - Push tag v*   (e.g. v0.0.013-alpha.1)
#   - Actions → Release → Run workflow
#
# Tags with alpha/beta/rc → GitHub prerelease.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 0.0.013-alpha.1)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as prerelease (alpha/beta)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - id: ver
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ env.RAW_VERSION }}"
          RAW="${RAW#v}"
          TAG="v${RAW}"
          PRE=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.prerelease }}" == "true" ]]; then
            PRE=true
          fi
          if echo "$RAW" | grep -Eiq '(alpha|beta|rc|pre|dev)'; then
            PRE=true
          fi
          {
            echo "version=$RAW"
            echo "tag=$TAG"
            echo "prerelease=$PRE"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$RAW prerelease=$PRE"

  build:
    name: ${{ matrix.artifact }}
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──────────────────────────────────────
          - os: windows-latest
            artifact: cordlang-windows-x64
            binary: cordlang.exe
            kind: windows-mingw
            arch: x64
          - os: windows-11-arm
            artifact: cordlang-windows-arm64
            binary: cordlang.exe
            kind: windows-arm
            arch: arm64
          # ── Linux ────────────────────────────────────────
          - os: ubuntu-latest
            artifact: cordlang-linux-x64
            binary: cordlang
            kind: unix
            arch: x64
          - os: ubuntu-24.04-arm
            artifact: cordlang-linux-arm64
            binary: cordlang
            kind: unix
            arch: arm64
          # ── macOS ────────────────────────────────────────
          - os: macos-13
            artifact: cordlang-macos-x64
            binary: cordlang
            kind: unix
            arch: x64
          - os: macos-latest
            artifact: cordlang-macos-arm64
            binary: cordlang
            kind: unix
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # ── Toolchains ───────────────────────────────────────
      - name: Install MinGW (Windows x64)
        if: matrix.kind == 'windows-mingw'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          gcc --version

      - name: Setup MSYS2 Clang (Windows ARM64)
        if: matrix.kind == 'windows-arm'
        uses: msys2/setup-msys2@de40abf46eff6b0a0916f3aff016a713daf8a5eb  # v2.29.0
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-headers-git
            mingw-w64-clang-aarch64-crt-git
            make
          path-type: minimal

      - name: Install build-essential (Linux)
        if: matrix.kind == 'unix' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential zip

      - name: Prepare macOS compiler
        if: matrix.kind == 'unix' && runner.os == 'macOS'
        run: |
          clang --version
          if ! command -v gcc >/dev/null 2>&1; then
            echo "CC=clang" >> "$GITHUB_ENV"
          fi

      # ── Build ────────────────────────────────────────────
      - name: Build Windows x64
        if: matrix.kind == 'windows-mingw'
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_release_win.ps1 -Version $env:VERSION

      - name: Build Windows ARM64
        if: matrix.kind == 'windows-arm'
        shell: msys2 {0}
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          export CC=clang
          export CXX=clang++
          make clean || true
          make -j"$(nproc)" RELEASE=1 VERSION="$VERSION"
          # MinGW/Clang writes cordlang.exe when targeting Windows
          if [[ -f cordlang && ! -f cordlang.exe ]]; then
            mv cordlang cordlang.exe
          fi
          ./cordlang.exe --version
          file ./cordlang.exe || true

      - name: Build Unix (Linux / macOS)
        if: matrix.kind == 'unix'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          make clean || true
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu || echo 2)" RELEASE=1 VERSION="$VERSION"
          ./cordlang --version
          file ./cordlang || true
          uname -m

      # ── Package ──────────────────────────────────────────
      - name: Package Windows
        if: startsWith(matrix.kind, 'windows')
        shell: pwsh
        env:
          ART: ${{ matrix.artifact }}
          BIN: ${{ matrix.binary }}
          VER: ${{ needs.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          New-Item -ItemType Directory -Force -Path "dist/$env:ART" | Out-Null
          Copy-Item $env:BIN "dist/$env:ART/"
          if (Test-Path LICENSE) { Copy-Item LICENSE "dist/$env:ART/" }
          if (Test-Path README.md) { Copy-Item README.md "dist/$env:ART/" }
          @"
          Cordlang CLI $($env:VER)
          Artifact: $($env:ART)
          Arch: $($env:ARCH)
          Binary: $($env:BIN)

          Unzip and run $($env:BIN), or add the folder to PATH.
          Docs: https://github.com/${{ github.repository }}
          "@ | Set-Content -Encoding utf8 "dist/$env:ART/INSTALL.txt"
          if (Test-Path "dist/$env:ART.zip") { Remove-Item "dist/$env:ART.zip" -Force }
          Compress-Archive -Path "dist/$env:ART" -DestinationPath "dist/$env:ART.zip" -Force
          Get-Item "dist/$env:ART.zip" | Format-List Name, Length

      - name: Package Unix
        if: matrix.kind == 'unix'
        shell: bash
        env:
          ART: ${{ matrix.artifact }}
          BIN: ${{ matrix.binary }}
          VER: ${{ needs.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "dist/$ART"
          cp "$BIN" "dist/$ART/"
          cp LICENSE "dist/$ART/" 2>/dev/null || true
          cp README.md "dist/$ART/" 2>/dev/null || true
          cat > "dist/$ART/INSTALL.txt" <<EOF
          Cordlang CLI ${VER}
          Artifact: ${ART}
          Arch: ${ARCH}
          Binary: ${BIN}

          chmod +x ${BIN}
          ./${BIN} --version

          Optional: sudo mv ${BIN} /usr/local/bin/cordlang
          Docs: https://github.com/${{ github.repository }}
          EOF
          (cd dist && zip -r "${ART}.zip" "$ART")
          ls -la "dist/${ART}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten + checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          find release-assets -type f -name '*.zip' -exec cp -f {} assets/ \;
          cd assets
          sha256sum *.zip | tee SHA256SUMS.txt
          ls -la

      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          VER="${{ needs.meta.outputs.version }}"
          PRE="${{ needs.meta.outputs.prerelease }}"
          TITLE="Cordlang ${VER}"
          CHANNEL="stable"
          if [[ "$PRE" == "true" ]]; then
            CHANNEL="prerelease (alpha/beta)"
          fi
          NOTES=$(cat <<EOF
          ## Cordlang ${VER}

          Installable CLI builds — **${CHANNEL}**.

          | Download | OS | CPU |
          |----------|----|-----|
          | \`cordlang-windows-x64.zip\` | Windows | x64 |
          | \`cordlang-windows-arm64.zip\` | Windows | ARM64 |
          | \`cordlang-linux-x64.zip\` | Linux | x64 |
          | \`cordlang-linux-arm64.zip\` | Linux | ARM64 |
          | \`cordlang-macos-x64.zip\` | macOS | Intel (x64) |
          | \`cordlang-macos-arm64.zip\` | macOS | Apple Silicon |
          | \`SHA256SUMS.txt\` | — | checksums |

          ### Install

          **Windows:** unzip and run \`cordlang.exe\` (or add the folder to PATH).

          **Linux / macOS:**
          \`\`\`bash
          unzip cordlang-*.zip
          chmod +x cordlang-*/cordlang
          sudo mv cordlang-*/cordlang /usr/local/bin/cordlang
          cordlang --version
          \`\`\`

          See \`docs/VERSIONING.md\` for alpha/beta tagging.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets"
            gh release upload "$TAG" assets/* --clobber
            if [[ "$PRE" == "true" ]]; then
              gh release edit "$TAG" --prerelease --title "$TITLE" --notes "$NOTES"
            else
              gh release edit "$TAG" --prerelease=false --title "$TITLE" --notes "$NOTES"
            fi
          else
            CREATE=(release create "$TAG" --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}")
            if [[ "$PRE" == "true" ]]; then
              CREATE+=(--prerelease)
            fi
            gh "${CREATE[@]}" assets/*
          fi
