# Build multi-platform Cordlang CLI binaries and publish a GitHub Release.
#
# Triggers:
#   - Push tag v*          (e.g. v0.0.013-alpha.1, v0.0.014-beta.1, v0.1.0)
#   - workflow_dispatch    (manual; creates the tag if missing)
#
# Pre-release: tags containing alpha / beta / rc (or dispatch prerelease=true)
# stay marked as GitHub prerelease. Stable tags without those suffixes publish
# a full release.
#
# Artifacts:
#   cordlang-windows-x64.zip
#   cordlang-linux-x64.zip      (Ubuntu runner — glibc; typically OK on Fedora)
#   cordlang-fedora-x64.zip     (built in Fedora container)
#   cordlang-linux-arm64.zip
#   cordlang-macos-arm64.zip
#   cordlang-macos-x64.zip
#   SHA256SUMS.txt

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 0.0.013-alpha.1)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as prerelease (alpha/beta)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Strip leading v from tag or use dispatch input
  RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - id: ver
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ env.RAW_VERSION }}"
          RAW="${RAW#v}"
          TAG="v${RAW}"
          PRE=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.prerelease }}" == "true" ]]; then
              PRE=true
            fi
          fi
          if echo "$RAW" | grep -Eiq '(alpha|beta|rc|pre|dev)'; then
            PRE=true
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$RAW prerelease=$PRE"

  build:
    name: Build (${{ matrix.artifact }})
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: cordlang-windows-x64
            binary: cordlang.exe
            kind: windows
          - os: ubuntu-latest
            artifact: cordlang-linux-x64
            binary: cordlang
            kind: unix
          - os: ubuntu-24.04-arm
            artifact: cordlang-linux-arm64
            binary: cordlang
            kind: unix
          - os: ubuntu-latest
            container: fedora:41
            artifact: cordlang-fedora-x64
            binary: cordlang
            kind: fedora
          - os: macos-latest
            artifact: cordlang-macos-arm64
            binary: cordlang
            kind: unix
          - os: macos-13
            artifact: cordlang-macos-x64
            binary: cordlang
            kind: unix

    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install toolchain (Windows MinGW)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install toolchain (Ubuntu / ARM)
        if: matrix.kind == 'unix' && runner.os == 'Linux'
        run: |
          if [ -n "${{ matrix.container }}" ]; then
            echo "Skipping apt (running in container)"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y build-essential zip

      - name: Install toolchain (Fedora)
        if: matrix.kind == 'fedora'
        run: dnf install -y gcc make diffutils zip findutils

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          # Xcode CLT is preinstalled on GHA macOS images
          clang --version
          # Prefer gcc from brew if present; otherwise use clang as CC
          if ! command -v gcc >/dev/null 2>&1; then
            echo "CC=clang" >> "$GITHUB_ENV"
          fi

      - name: Build (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_release_win.ps1 -Version $env:VERSION

      - name: Build (Unix / Fedora / macOS)
        if: matrix.kind != 'windows'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          make clean || true
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu || echo 2)" RELEASE=1 VERSION="$VERSION"
          ./cordlang --version
          file ./cordlang || true

      - name: Package (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          ART: ${{ matrix.artifact }}
          BIN: ${{ matrix.binary }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path "dist/$env:ART" | Out-Null
          Copy-Item $env:BIN "dist/$env:ART/"
          if (Test-Path LICENSE) { Copy-Item LICENSE "dist/$env:ART/" }
          if (Test-Path README.md) { Copy-Item README.md "dist/$env:ART/" }
          @"
          Cordlang CLI $($env:VER)
          Artifact: $($env:ART)
          Binary: $($env:BIN)

          Alpha/beta toolchain unless the tag is a stable semver.
          Docs: https://github.com/${{ github.repository }}
          "@ | Set-Content -Encoding utf8 "dist/$env:ART/RELEASE.txt"
          if (Test-Path "dist/$env:ART.zip") { Remove-Item "dist/$env:ART.zip" -Force }
          Compress-Archive -Path "dist/$env:ART" -DestinationPath "dist/$env:ART.zip" -Force
          Get-Item "dist/$env:ART.zip" | Format-List Name, Length

      - name: Package (Unix / Fedora / macOS)
        if: matrix.kind != 'windows'
        shell: bash
        env:
          ART: ${{ matrix.artifact }}
          BIN: ${{ matrix.binary }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "dist/$ART"
          cp "$BIN" "dist/$ART/"
          cp LICENSE "dist/$ART/" 2>/dev/null || true
          cp README.md "dist/$ART/" 2>/dev/null || true
          cat > "dist/$ART/RELEASE.txt" <<EOF
          Cordlang CLI ${VER}
          Artifact: ${ART}
          Binary: ${BIN}

          Alpha/beta toolchain unless the tag is a stable semver.
          Docs: https://github.com/${{ github.repository }}
          EOF
          (cd dist && zip -r "${ART}.zip" "$ART")
          ls -la "dist/${ART}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for notes)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten + checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          find release-assets -type f -name '*.zip' -exec cp {} assets/ \;
          cd assets
          sha256sum *.zip > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          VER="${{ needs.meta.outputs.version }}"
          PRE="${{ needs.meta.outputs.prerelease }}"
          TITLE="Cordlang ${VER}"
          CHANNEL="stable"
          if [[ "$PRE" == "true" ]]; then
            CHANNEL="prerelease (alpha/beta)"
          fi
          NOTES=$(cat <<EOF
          ## Cordlang ${VER}

          Multi-platform CLI builds. Channel: **${CHANNEL}**.

          | Artifact | Target |
          |----------|--------|
          | \`cordlang-windows-x64.zip\` | Windows x64 (\`.exe\`) |
          | \`cordlang-linux-x64.zip\` | Linux x64 (Ubuntu glibc; usually fine on Fedora/Debian) |
          | \`cordlang-fedora-x64.zip\` | Linux x64 built on Fedora 41 |
          | \`cordlang-linux-arm64.zip\` | Linux ARM64 |
          | \`cordlang-macos-arm64.zip\` | macOS Apple Silicon |
          | \`cordlang-macos-x64.zip\` | macOS Intel |
          | \`SHA256SUMS.txt\` | Checksums |

          ### Install (example)

          \`\`\`bash
          # Linux / macOS
          unzip cordlang-*.zip
          chmod +x cordlang-*/cordlang
          ./cordlang-*/cordlang --version
          \`\`\`

          Language surface: see \`docs/SPEC.md\` / \`docs/VERSIONING.md\`.
          Playground WASM is separate (\`playground/\`).
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets"
            gh release upload "$TAG" assets/* --clobber
            if [[ "$PRE" == "true" ]]; then
              gh release edit "$TAG" --prerelease --title "$TITLE" --notes "$NOTES"
            else
              gh release edit "$TAG" --prerelease=false --title "$TITLE" --notes "$NOTES"
            fi
          else
            CREATE=(release create "$TAG" --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}")
            if [[ "$PRE" == "true" ]]; then
              CREATE+=(--prerelease)
            fi
            gh "${CREATE[@]}" assets/*
          fi
