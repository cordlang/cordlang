name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-windows:
    name: Build + goldens + template (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install MinGW
        run: |
          choco install mingw -y --no-progress
          echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: Cache npm (template scaffolds)
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\npm-cache
            templates\counter\dist\react\node_modules
            templates\counter\dist\svelte\node_modules
            templates\counter\dist\vue\node_modules
          key: ${{ runner.os }}-tpl-v2-${{ hashFiles('templates/counter/**/*.cord', 'templates/counter/cordlang.json') }}
          restore-keys: |
            ${{ runner.os }}-tpl-v2-
            ${{ runner.os }}-tpl-v1-

      - name: Build
        shell: cmd
        run: build.bat

      - name: Golden tests
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tests\run_tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Template react + svelte + vue --check
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tests\run_template_check.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Backend parity (Official compile smoke)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tests\run_backend_parity.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Playground wasm_api smoke
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File playground\smoke_native.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  test-ubuntu:
    name: Build + goldens + template (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: Cache npm (template scaffolds)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            templates/counter/dist/react/node_modules
            templates/counter/dist/svelte/node_modules
            templates/counter/dist/vue/node_modules
          key: ${{ runner.os }}-tpl-v2-${{ hashFiles('templates/counter/**/*.cord', 'templates/counter/cordlang.json') }}
          restore-keys: |
            ${{ runner.os }}-tpl-v2-
            ${{ runner.os }}-tpl-v1-

      - name: Build (-Werror)
        run: make -j"$(nproc)"

      - name: Golden tests
        run: |
          chmod +x tests/run_tests.sh tests/run_template_check.sh tests/run_smoke_examples.sh tests/run_backend_parity.sh
          ./tests/run_tests.sh

      - name: Smoke templates + examples
        run: ./tests/run_smoke_examples.sh

      - name: Template react + svelte + vue --check
        run: ./tests/run_template_check.sh

      - name: Backend parity (Official compile smoke)
        run: ./tests/run_backend_parity.sh

      - name: Playground wasm_api smoke
        run: |
          chmod +x playground/smoke_native.sh
          ./playground/smoke_native.sh

  test-ubuntu-asan:
    name: ASAN/UBSAN goldens (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build with sanitizers
        run: make clean && make -j"$(nproc)" ASAN=1

      - name: Golden tests under ASAN
        run: |
          chmod +x tests/run_tests.sh
          ASAN_OPTIONS=detect_leaks=1 ./tests/run_tests.sh

      - name: Template check under ASAN leaks
        run: |
          ASAN_OPTIONS=detect_leaks=1 ./cordlang check templates/counter
