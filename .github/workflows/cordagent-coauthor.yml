name: CordAgent co-author cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: cordagent-coauthor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  strip-ai-coauthors:
    name: Strip AI Co-authored-by → CordAgent
    runs-on: ubuntu-latest

    # Same-repo PRs only. Fork PRs cannot be safely force-pushed with
    # GITHUB_TOKEN / App install from the base repo.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Mint CordAgent App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CORDAGENT_APP_ID }}
          private-key: ${{ secrets.CORDAGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout private CordAgent source
        uses: actions/checkout@v4
        with:
          repository: cordlang/cordagent
          path: .cordagent-src
          token: ${{ steps.app-token.outputs.token }}
          ref: master

      - name: Run CordAgent
        id: cord
        uses: ./.cordagent-src/action
        with:
          ours: "CordAgent <cordagent@cordlang.com>"
          mode: strip-known-agents
          push: "true"
          github_token: ${{ steps.app-token.outputs.token }}
          bot_name: "CordAgent[bot]"
          bot_email: "${{ secrets.CORDAGENT_APP_ID }}+cordagent[bot]@users.noreply.github.com"

      - name: Summary
        if: always()
        run: |
          echo "### CordAgent co-author cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rewritten commits: \`${{ steps.cord.outputs.rewritten }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changed: \`${{ steps.cord.outputs.changed }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Identity: \`CordAgent[bot]\`" >> "$GITHUB_STEP_SUMMARY"
