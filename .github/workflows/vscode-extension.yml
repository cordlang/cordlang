name: VS Code extension

on:
  push:
    branches: [main, master]
    paths:
      - "editor/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "editor/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: editor/vscode

jobs:
  package:
    name: Install + package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json

      - name: npm ci
        run: npm ci

      # `vscode` is only available inside the editor host — never require('./extension.js')
      # under plain Node. Syntax-check + static package validation are enough.
      - name: Syntax-check extension entry
        run: node --check extension.js

      - name: Validate package manifest + assets
        run: node scripts/check.mjs

      - name: Package VSIX
        run: npx --yes @vscode/vsce@3 package --no-update-package-json --allow-missing-repository

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cordlang-vscode
          path: editor/vscode/*.vsix
          if-no-files-found: error
